name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.name }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            artifact: windows-x86_64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            artifact: linux-x86_64
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            formats: dmg
            artifact: macos-x86_64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            formats: dmg
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Linux native and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libnotify-bin \
            libsecret-1-dev \
            libxdo-dev \
            pkg-config \
            squashfs-tools

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Validate tag and package versions
        run: cargo xtask verify-version ${{ needs.resolve.outputs.tag }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build release binary
        run: cargo build -p volc-desktop --release --locked --target ${{ matrix.target }}

      - name: Stage target binary for packager
        shell: bash
        run: |
          mkdir -p target/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/volc-desktop.exe" target/release/
          else
            cp "target/${{ matrix.target }}/release/volc-desktop" target/release/
          fi

      - name: Create native package
        run: cargo packager --release --config crates/volc-desktop/packager.json --formats ${{ matrix.formats }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/packages/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [resolve, package]
    runs-on: ubuntu-22.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: VOLC Status ${{ needs.resolve.outputs.tag }}
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
