name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to rebuild
        required: true
        type: string

permissions:
  contents: write

env:
  # Tauri updater signing. The private key and its password live ONLY in
  # GitHub Actions Secrets — never in the repository.
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  resolve:
    name: Validate release version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.name }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
            artifact: windows-x86_64
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
            artifact: linux-x86_64
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            formats: dmg
            artifact: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Linux native and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libnotify-bin \
            libsecret-1-dev \
            libxdo-dev \
            pkg-config \
            patchelf

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag and package versions
        run: cargo xtask verify-version ${{ needs.resolve.outputs.tag }}

      - name: Build and publish bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: OpenCode Quota Checker ${{ needs.resolve.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Upload bundle artifacts for the legacy manifest job
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/*
          if-no-files-found: error

  prepare-legacy:
    name: Prepare legacy Iced update bridge
    needs: [resolve, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download bundles
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Normalize legacy release asset names
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 2 -type f | sort
          rename_one() {
            local pattern="$1" name="$2"
            local file
            file=$(find . -maxdepth 2 -type f -name "$pattern" | head -n 1)
            if [[ -z "$file" ]]; then
              echo "missing asset for $name (pattern $pattern)" >&2
              exit 1
            fi
            mv "$file" "$name"
          }
          # The legacy Iced updater (update.json schema 1) expects these exact
          # names; keep publishing them for one release cycle after the switch.
          rename_one "*-setup.exe" opencode-quota-checker-windows-x86_64.exe
          rename_one "*.AppImage" opencode-quota-checker-linux-x86_64.AppImage
          rename_one "*.deb" opencode-quota-checker-linux-x86_64.deb
          rename_one "*.dmg" opencode-quota-checker-macos-aarch64.dmg
          ls -la

      - name: Generate SHA256SUMS and legacy update.json
        run: cargo xtask update-manifest ${{ needs.resolve.outputs.tag }} release-assets

      - name: Attach legacy manifest to the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: |
            release-assets/SHA256SUMS
            release-assets/update.json

  finalize:
    name: Publish release
    needs: [resolve, package, prepare-legacy]
    runs-on: ubuntu-22.04
    steps:
      - name: Finalize the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve.outputs.tag }}" --draft=false
          gh release view "${{ needs.resolve.outputs.tag }}" --json assets --jq '.assets[].name' | sort
