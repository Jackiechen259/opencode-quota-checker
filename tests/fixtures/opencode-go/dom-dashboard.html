<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenCode Go Usage</title>
  </head>
  <body>
    <main>
      <h1>OpenCode Go Usage</h1>
      <section>
        <div data-slot="usage-item">
          <span data-slot="usage-label">5 hour</span>
          <span data-slot="usage-value">78%</span>
          <span data-slot="reset-time">in 1h 42m</span>
        </div>
        <div data-slot="usage-item">
          <span data-slot="usage-label">Weekly</span>
          <span data-slot="usage-value">52%</span>
          <span data-slot="reset-time">in 3d 7h</span>
        </div>
        <div data-slot="usage-item">
          <span data-slot="usage-label">Monthly</span>
          <span data-slot="usage-value">19%</span>
          <span data-slot="reset-time">in 17d</span>
        </div>
      </section>
    </main>
  </body>
</html>
