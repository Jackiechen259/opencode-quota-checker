<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in - OpenCode</title>
  </head>
  <body>
    <main>
      <h1>Welcome back</h1>
      <p>Log in to your OpenCode account to continue.</p>
      <form action="/api/auth/login" method="post">
        <label>
          Email
          <input name="email" type="email" />
        </label>
        <label>
          Password
          <input name="password" type="password" />
        </label>
        <button type="submit">Sign in</button>
      </form>
      <p>Don't have an account? <a href="/sign-up">Create one</a></p>
    </main>
  </body>
</html>
